<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AA Logistik · Operations</title>
    <meta name="description" content="AA Logistik operational case and task management">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e31e24'/%3E%3Cpath d='M7 22 12 9l4 13 4-13 5 13' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
    <style>
        :root {
            --navy: #061c31;
            --navy2: #082945;
            --blue: #0877d1;
            --bluebg: #eaf4ff;
            --ink: #14233a;
            --muted: #6b778a;
            --line: #dce4ec;
            --bg: #f2f6fa;
            --white: #fff;
            --red: #e31e24;
            --redbg: #fff0f1;
            --amber: #bf7900;
            --amberbg: #fff6df;
            --green: #188756;
            --greenbg: #e9f8ef;
            --shadow: 0 2px 8px rgba(28, 50, 78, .06)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-width: 1180px;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.4 Inter, "Segoe UI", Arial, sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            display: grid;
            grid-template-columns: 224px 1fr;
            min-height: 100vh
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 224px;
            background: var(--navy);
            color: #dbe6f0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .brand {
            height: 76px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255, 255, 255, .08)
        }

        .brand img {
            width: 170px;
            height: 45px;
            object-fit: contain;
            background: #fff;
            border-radius: 3px;
            padding: 5px
        }

        .nav {
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .nav button {
            border: 0;
            background: transparent;
            color: #d6e1eb;
            padding: 11px 12px;
            border-radius: 5px;
            text-align: left;
            display: flex;
            gap: 11px;
            align-items: center;
            font-weight: 600
        }

        .nav button:hover,
        .nav button.active {
            color: #fff;
            background: #075b98;
            box-shadow: inset 3px 0 #35a4f4
        }

        .nav .ico {
            width: 19px;
            text-align: center;
            color: #fff
        }

        .truck-panel {
            margin-top: auto;
            height: 240px;
            position: relative;
            background: url('assets/aa-truck.webp') center/cover no-repeat
        }

        .truck-panel:before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--navy) 0%, rgba(6, 28, 49, .62) 38%, rgba(6, 28, 49, .32) 100%)
        }

        .main {
            grid-column: 2
        }

        .topbar {
            height: 64px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 4
        }

        .search {
            width: 410px;
            position: relative
        }

        .search input {
            width: 100%;
            height: 36px;
            background: #f5f8fb;
            border: 1px solid #e1e7ee;
            border-radius: 5px;
            padding: 0 13px 0 36px
        }

        .search:before {
            content: '⌕';
            position: absolute;
            left: 13px;
            top: 7px;
            color: #718095;
            font-size: 17px
        }

        .userbox {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 13px
        }

        .bell {
            border: 0;
            background: transparent;
            font-size: 18px
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #dfe8f3;
            font-weight: 800;
            color: #34475c
        }

        .userbox strong {
            display: block;
            font-size: 13px
        }

        .userbox small {
            display: block;
            color: var(--muted);
            font-size: 11px
        }

        .role-select {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 4px;
            padding: 6px 7px;
            font-size: 12px
        }

        .content {
            padding: 24px 30px 46px;
            max-width: 1600px
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px
        }

        .page-head h1 {
            font-size: 24px;
            letter-spacing: -.02em;
            margin: 0 0 3px
        }

        .page-head p {
            margin: 0;
            color: var(--muted)
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .btn {
            border: 1px solid #cbd6e1;
            background: #fff;
            border-radius: 4px;
            padding: 8px 13px;
            font-weight: 650
        }

        .btn:hover {
            background: #f5f8fb
        }

        .btn.primary {
            background: #096dcc;
            border-color: #096dcc;
            color: #fff
        }

        .btn:disabled {
            opacity: .52;
            cursor: not-allowed
        }

        .link {
            border: 0;
            background: none;
            color: #0871c7;
            font-weight: 700;
            padding: 0
        }

        .back {
            border: 0;
            background: none;
            padding: 0 0 11px;
            color: #40536a;
            font-weight: 650
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 18px
        }

        .kpi {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px 15px;
            box-shadow: var(--shadow);
            min-height: 91px;
            position: relative
        }

        .kpi:before {
            content: "";
            position: absolute;
            left: -1px;
            top: 13px;
            bottom: 13px;
            width: 3px;
            border-radius: 3px;
            background: var(--blue)
        }

        .kpi.amber:before {
            background: #f0a000
        }

        .kpi.red:before {
            background: var(--red)
        }

        .kpi label {
            display: block;
            color: #425169;
            font-weight: 650;
            font-size: 12px;
            max-width: 120px
        }

        .kpi strong {
            display: block;
            font-size: 25px;
            margin-top: 7px
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: var(--shadow);
            overflow: hidden
        }

        .card-head {
            min-height: 50px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line)
        }

        .card-head h2,
        .card-head h3 {
            font-size: 15px;
            margin: 0
        }

        .card-body {
            padding: 17px
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 16px
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            background: #f6f8fb;
            color: #56657a;
            text-align: left;
            text-transform: none;
            font-size: 12px;
            font-weight: 700;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line)
        }

        td {
            padding: 11px 12px;
            border-bottom: 1px solid #e7ecf1;
            vertical-align: middle
        }

        tbody tr:last-child td {
            border-bottom: 0
        }

        tbody tr:hover {
            background: #f9fbfd
        }

        .id {
            color: #0873c8;
            font-weight: 750
        }

        .sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            border-radius: 4px;
            padding: 3px 7px;
            background: #edf1f5;
            color: #526174;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap
        }

        .pill.blue {
            background: var(--bluebg);
            color: #0869b6
        }

        .pill.green {
            background: var(--greenbg);
            color: var(--green)
        }

        .pill.amber {
            background: var(--amberbg);
            color: var(--amber)
        }

        .pill.red {
            background: var(--redbg);
            color: #c51f2d
        }

        .filters {
            display: flex;
            gap: 9px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line)
        }

        .filters input,
        .filters select {
            height: 35px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #fff;
            padding: 0 10px
        }

        .filters input {
            width: 260px
        }

        .tabs {
            display: flex;
            gap: 24px;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
            background: #fff
        }

        .tabs button {
            border: 0;
            border-bottom: 2px solid transparent;
            background: none;
            padding: 13px 1px;
            color: #647289;
            font-weight: 650
        }

        .tabs button.active {
            color: #0871c7;
            border-color: #0871c7
        }

        .attention-list {
            padding: 4px 17px
        }

        .attention {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            gap: 11px;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid #edf0f4
        }

        .attention:last-child {
            border: 0
        }

        .attention .icon {
            width: 32px;
            height: 32px;
            border-radius: 5px;
            background: var(--amberbg);
            color: var(--amber);
            display: grid;
            place-items: center;
            font-weight: 900
        }

        .attention strong {
            display: block
        }

        .workload {
            padding: 13px 17px
        }

        .person {
            display: grid;
            grid-template-columns: 34px 1fr 50px 1fr;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #edf1f4
        }

        .person:last-child {
            border: 0
        }

        .mini-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e8edf3;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 800
        }

        .bar {
            height: 7px;
            background: #e9edf2;
            border-radius: 4px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: #3589d0
        }

        .review-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.12fr;
            gap: 14px;
            align-items: start
        }

        .panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            min-height: 650px;
            overflow: hidden
        }

        .panel-title {
            height: 49px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid var(--line)
        }

        .panel-title h2 {
            font-size: 14px;
            margin: 0
        }

        .email-meta {
            padding: 13px 15px;
            border-bottom: 1px solid var(--line)
        }

        .email-meta dl {
            display: grid;
            grid-template-columns: 56px 1fr;
            margin: 0;
            row-gap: 6px
        }

        .email-meta dt {
            color: var(--muted)
        }

        .email-meta dd {
            margin: 0
        }

        .email-body {
            padding: 15px;
            line-height: 1.58
        }

        .attachment {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 9px 10px;
            margin-top: 8px;
            background: #fafbfd
        }

        .fieldlist {
            padding: 13px 15px
        }

        .rowfield {
            display: grid;
            grid-template-columns: 115px 1fr;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #edf1f4
        }

        .rowfield label {
            color: var(--muted)
        }

        .rowfield strong {
            font-weight: 650
        }

        .editfield {
            padding: 12px 15px
        }

        .editfield label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin: 9px 0 4px
        }

        .editfield input,
        .editfield select {
            width: 100%;
            height: 35px;
            border: 1px solid #cdd7e1;
            border-radius: 4px;
            padding: 0 9px
        }

        .proposal {
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 11px;
            margin-top: 9px
        }

        .proposal header {
            display: flex;
            justify-content: space-between
        }

        .proposal p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 12px
        }

        .case-head {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            margin-bottom: 16px
        }

        .case-top {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 17px
        }

        .case-top h1 {
            font-size: 21px;
            margin: 0 0 3px
        }

        .case-top .actions {
            margin-left: auto
        }

        .case-content {
            display: grid;
            grid-template-columns: .9fr 1.3fr 1fr;
            gap: 15px
        }

        .info-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px
        }

        .info-card h3 {
            font-size: 14px;
            margin: 0 0 15px
        }

        .kv {
            display: grid;
            grid-template-columns: 115px 1fr;
            gap: 9px;
            padding: 9px 0;
            border-bottom: 1px solid #edf0f3
        }

        .kv:last-child {
            border: 0
        }

        .kv label {
            color: var(--muted)
        }

        .timeline {
            position: relative
        }

        .event {
            display: grid;
            grid-template-columns: 18px 1fr;
            gap: 9px;
            padding-bottom: 17px
        }

        .event .dot {
            width: 9px;
            height: 9px;
            border: 2px solid #147bd1;
            border-radius: 50%;
            margin: 4px;
            position: relative
        }

        .event .dot:after {
            content: "";
            position: absolute;
            left: 2px;
            top: 9px;
            height: 43px;
            border-left: 1px solid #cbd6e0
        }

        .event:last-child .dot:after {
            display: none
        }

        .event strong {
            display: block;
            font-size: 13px
        }

        .event small {
            display: block;
            color: var(--muted)
        }

        .notice {
            background: var(--amberbg);
            border: 1px solid #efd69b;
            color: #77520b;
            border-radius: 5px;
            padding: 11px 13px;
            margin-bottom: 14px
        }

        .notice.green {
            background: var(--greenbg);
            border-color: #b9e1ca;
            color: var(--green)
        }

        .drawer {
            position: fixed;
            top: 64px;
            right: 0;
            bottom: 0;
            width: 440px;
            background: #fff;
            z-index: 10;
            border-left: 1px solid var(--line);
            box-shadow: -8px 0 25px rgba(19, 39, 62, .14);
            padding: 20px;
            overflow: auto
        }

        .drawer-bg {
            position: fixed;
            inset: 64px 0 0 224px;
            background: rgba(8, 29, 49, .25);
            z-index: 9
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            padding: 12px 16px;
            background: #11304d;
            color: #fff;
            border-radius: 5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .2);
            z-index: 30;
            opacity: 0;
            transform: translateY(8px);
            transition: .2s
        }

        .toast.show {
            opacity: 1;
            transform: none
        }

        .chart {
            display: flex;
            align-items: end;
            gap: 22px;
            height: 190px;
            padding: 25px 20px 10px
        }

        .chart div {
            flex: 1;
            text-align: center;
            color: var(--muted);
            font-size: 12px
        }

        .chart i {
            display: block;
            width: 34px;
            margin: 0 auto 8px;
            background: #2c7fc0;
            border-radius: 3px 3px 0 0
        }

        .hidden {
            display: none !important
        }

        .truck-panel {
            background-position: 27% 74%;
            background-size: 820px auto
        }

        .truck-panel:before {
            background: linear-gradient(180deg, var(--navy) 0%, rgba(6, 28, 49, .7) 32%, rgba(6, 28, 49, .26) 100%)
        }

        .reset-demo {
            border: 1px solid #c7d2de;
            background: #fff;
            border-radius: 4px;
            padding: 7px 10px;
            color: #43546a;
            font-size: 12px;
            font-weight: 700
        }

        .reset-demo:hover {
            background: #f1f5f9;
            color: #172a43
        }

        .login-screen {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 46% 54%;
            background: #fff
        }

        .login-visual {
            position: relative;
            background: linear-gradient(rgba(6, 28, 49, .78), rgba(6, 28, 49, .88)), url('assets/aa-truck.webp') center/cover;
            color: #fff;
            padding: 54px;
            display: flex;
            flex-direction: column
        }

        .login-logo {
            width: 245px;
            background: #fff;
            border-radius: 5px;
            padding: 9px 13px
        }

        .login-logo img {
            width: 100%;
            display: block
        }

        .login-message {
            margin-top: auto;
            max-width: 500px;
            margin-bottom: 55px
        }

        .login-message h1 {
            font-size: 38px;
            line-height: 1.14;
            margin: 0 0 15px
        }

        .login-message p {
            font-size: 18px;
            color: #d2deea
        }

        .login-entry {
            display: grid;
            place-items: center
        }

        .login-box {
            width: 420px
        }

        .login-box h2 {
            font-size: 28px;
            margin: 0 0 7px
        }

        .login-box>p {
            color: var(--muted);
            margin: 0 0 25px
        }

        .microsoft-login {
            width: 100%;
            height: 50px;
            border: 1px solid #bfcad6;
            border-radius: 5px;
            background: #fff;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px
        }

        .ms-grid {
            display: grid;
            grid-template-columns: 8px 8px;
            gap: 2px
        }

        .ms-grid i {
            width: 8px;
            height: 8px;
            display: block
        }

        .ms-grid i:nth-child(1) {
            background: #f35325
        }

        .ms-grid i:nth-child(2) {
            background: #81bc06
        }

        .ms-grid i:nth-child(3) {
            background: #05a6f0
        }

        .ms-grid i:nth-child(4) {
            background: #ffba08
        }

        .login-note {
            margin-top: 17px;
            background: #f5f8fb;
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 12px;
            color: var(--muted);
            font-size: 12px
        }

        .profile-trigger {
            border: 0;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            border-radius: 5px;
            padding: 4px 7px
        }

        .profile-trigger:hover {
            background: #f1f5f9
        }

        .menu-wrap {
            position: relative
        }

        .drop-menu {
            position: absolute;
            right: 0;
            top: 44px;
            width: 300px;
            max-height: 465px;
            overflow: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(17, 39, 65, .18);
            z-index: 50;
            padding: 7px
        }

        .drop-menu button {
            width: 100%;
            border: 0;
            background: #fff;
            text-align: left;
            padding: 10px;
            border-radius: 4px
        }

        .drop-menu button:hover,
        .drop-menu button.selected {
            background: #edf5fd
        }

        .drop-menu strong,
        .drop-menu small {
            display: block
        }

        .drop-menu small {
            color: var(--muted)
        }

        .menu-label {
            padding: 7px 10px 3px;
            color: #718095;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .bell-wrap {
            position: relative
        }

        .bell-badge {
            position: absolute;
            right: -3px;
            top: -3px;
            background: var(--red);
            color: #fff;
            border-radius: 9px;
            min-width: 16px;
            height: 16px;
            font-size: 10px;
            display: grid;
            place-items: center
        }

        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(5, 24, 42, .46);
            z-index: 60;
            display: grid;
            place-items: center
        }

        .assign-modal {
            width: 560px;
            max-height: 88vh;
            background: #fff;
            border-radius: 7px;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .25);
            overflow: auto
        }

        .assign-modal h2 {
            font-size: 18px;
            margin: 0;
            padding: 17px;
            border-bottom: 1px solid var(--line)
        }

        .assign-modal .body {
            padding: 18px
        }

        .assign-modal .footer {
            padding: 14px 18px;

        }
        function orderInlineDisplayDate(value){

        }

            return {number,unit};
        }
