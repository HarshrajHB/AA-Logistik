<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AA Logistik · Operations</title>
    <meta name="description" content="AA Logistik operational case and task management">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e31e24'/%3E%3Cpath d='M7 22 12 9l4 13 4-13 5 13' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
    <style>
        :root {
            --navy: #061c31;
            --navy2: #082945;
            --blue: #0877d1;
            --bluebg: #eaf4ff;
            --ink: #14233a;
            --muted: #6b778a;
            --line: #dce4ec;
            --bg: #f2f6fa;
            --white: #fff;
            --red: #e31e24;
            --redbg: #fff0f1;
            --amber: #bf7900;
            --amberbg: #fff6df;
            --green: #188756;
            --greenbg: #e9f8ef;
            --shadow: 0 2px 8px rgba(28, 50, 78, .06)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-width: 1180px;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.4 Inter, "Segoe UI", Arial, sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            display: grid;
            grid-template-columns: 224px 1fr;
            min-height: 100vh
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 224px;
            background: var(--navy);
            color: #dbe6f0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .brand {
            height: 76px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255, 255, 255, .08)
        }

        .brand img {
            width: 170px;
            height: 45px;
            object-fit: contain;
            background: #fff;
            border-radius: 3px;
            padding: 5px
        }

        .nav {
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .nav button {
            border: 0;
            background: transparent;
            color: #d6e1eb;
            padding: 11px 12px;
            border-radius: 5px;
            text-align: left;
            display: flex;
            gap: 11px;
            align-items: center;
            font-weight: 600
        }

        .nav button:hover,
        .nav button.active {
            color: #fff;
            background: #075b98;
            box-shadow: inset 3px 0 #35a4f4
        }

        .nav .ico {
            width: 19px;
            text-align: center;
            color: #fff
        }

        .truck-panel {
            margin-top: auto;
            height: 240px;
            position: relative;
            background: url('assets/aa-truck.webp') center/cover no-repeat
        }

        .truck-panel:before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--navy) 0%, rgba(6, 28, 49, .62) 38%, rgba(6, 28, 49, .32) 100%)
        }

        .main {
            grid-column: 2
        }

        .topbar {
            height: 64px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 4
        }

        .search {
            width: 410px;
            position: relative
        }

        .search input {
            width: 100%;
            height: 36px;
            background: #f5f8fb;
            border: 1px solid #e1e7ee;
            border-radius: 5px;
            padding: 0 13px 0 36px
        }

        .search:before {
            content: '⌕';
            position: absolute;
            left: 13px;
            top: 7px;
            color: #718095;
            font-size: 17px
        }

        .userbox {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 13px
        }

        .bell {
            border: 0;
            background: transparent;
            font-size: 18px
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #dfe8f3;
            font-weight: 800;
            color: #34475c
        }

        .userbox strong {
            display: block;
            font-size: 13px
        }

        .userbox small {
            display: block;
            color: var(--muted);
            font-size: 11px
        }

        .role-select {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 4px;
            padding: 6px 7px;
            font-size: 12px
        }

        .content {
            padding: 24px 30px 46px;
            max-width: 1600px
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px
        }

        .page-head h1 {
            font-size: 24px;
            letter-spacing: -.02em;
            margin: 0 0 3px
        }

        .page-head p {
            margin: 0;
            color: var(--muted)
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .btn {
            border: 1px solid #cbd6e1;
            background: #fff;
            border-radius: 4px;
            padding: 8px 13px;
            font-weight: 650
        }

        .btn:hover {
            background: #f5f8fb
        }

        .btn.primary {
            background: #096dcc;
            border-color: #096dcc;
            color: #fff
        }

        .btn:disabled {
            opacity: .52;
            cursor: not-allowed
        }

        .link {
            border: 0;
            background: none;
            color: #0871c7;
            font-weight: 700;
            padding: 0
        }

        .back {
            border: 0;
            background: none;
            padding: 0 0 11px;
            color: #40536a;
            font-weight: 650
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 18px
        }

        .kpi {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px 15px;
            box-shadow: var(--shadow);
            min-height: 91px;
            position: relative
        }

        .kpi:before {
            content: "";
            position: absolute;
            left: -1px;
            top: 13px;
            bottom: 13px;
            width: 3px;
            border-radius: 3px;
            background: var(--blue)
        }

        .kpi.amber:before {
            background: #f0a000
        }

        .kpi.red:before {
            background: var(--red)
        }

        .kpi label {
            display: block;
            color: #425169;
            font-weight: 650;
            font-size: 12px;
            max-width: 120px
        }

        .kpi strong {
            display: block;
            font-size: 25px;
            margin-top: 7px
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: var(--shadow);
            overflow: hidden
        }

        .card-head {
            min-height: 50px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line)
        }

        .card-head h2,
        .card-head h3 {
            font-size: 15px;
            margin: 0
        }

        .card-body {
            padding: 17px
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 16px
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            background: #f6f8fb;
            color: #56657a;
            text-align: left;
            text-transform: none;
            font-size: 12px;
            font-weight: 700;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line)
        }

        td {
            padding: 11px 12px;
            border-bottom: 1px solid #e7ecf1;
            vertical-align: middle
        }

        tbody tr:last-child td {
            border-bottom: 0
        }

        tbody tr:hover {
            background: #f9fbfd
        }

        .id {
            color: #0873c8;
            font-weight: 750
        }

        .sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            border-radius: 4px;
            padding: 3px 7px;
            background: #edf1f5;
            color: #526174;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap
        }

        .pill.blue {
            background: var(--bluebg);
            color: #0869b6
        }

        .pill.green {
            background: var(--greenbg);
            color: var(--green)
        }

        .pill.amber {
            background: var(--amberbg);
            color: var(--amber)
        }

        .pill.red {
            background: var(--redbg);
            color: #c51f2d
        }

        .filters {
            display: flex;
            gap: 9px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line)
        }

        .filters input,
        .filters select {
            height: 35px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #fff;
            padding: 0 10px
        }

        .filters input {
            width: 260px
        }

        .tabs {
            display: flex;
            gap: 24px;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
            background: #fff
        }

        .tabs button {
            border: 0;
            border-bottom: 2px solid transparent;
            background: none;
            padding: 13px 1px;
            color: #647289;
            font-weight: 650
        }

        .tabs button.active {
            color: #0871c7;
            border-color: #0871c7
        }

        .attention-list {
            padding: 4px 17px
        }

        .attention {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            gap: 11px;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid #edf0f4
        }

        .attention:last-child {
            border: 0
        }

        .attention .icon {
            width: 32px;
            height: 32px;
            border-radius: 5px;
            background: var(--amberbg);
            color: var(--amber);
            display: grid;
            place-items: center;
            font-weight: 900
        }

        .attention strong {
            display: block
        }

        .workload {
            padding: 13px 17px
        }

        .person {
            display: grid;
            grid-template-columns: 34px 1fr 50px 1fr;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #edf1f4
        }

        .person:last-child {
            border: 0
        }

        .mini-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e8edf3;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 800
        }

        .bar {
            height: 7px;
            background: #e9edf2;
            border-radius: 4px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: #3589d0
        }

        .review-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.12fr;
            gap: 14px;
            align-items: start
        }

        .panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            min-height: 650px;
            overflow: hidden
        }

        .panel-title {
            height: 49px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid var(--line)
        }

        .panel-title h2 {
            font-size: 14px;
            margin: 0
        }

        .email-meta {
            padding: 13px 15px;
            border-bottom: 1px solid var(--line)
        }

        .email-meta dl {
            display: grid;
            grid-template-columns: 56px 1fr;
            margin: 0;
            row-gap: 6px
        }

        .email-meta dt {
            color: var(--muted)
        }

        .email-meta dd {
            margin: 0
        }

        .email-body {
            padding: 15px;
            line-height: 1.58
        }

        .attachment {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 9px 10px;
            margin-top: 8px;
            background: #fafbfd
        }

        .fieldlist {
            padding: 13px 15px
        }

        .rowfield {
            display: grid;
            grid-template-columns: 115px 1fr;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #edf1f4
        }

        .rowfield label {
            color: var(--muted)
        }

        .rowfield strong {
            font-weight: 650
        }

        .editfield {
            padding: 12px 15px
        }

        .editfield label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin: 9px 0 4px
        }

        .editfield input,
        .editfield select {
            width: 100%;
            height: 35px;
            border: 1px solid #cdd7e1;
            border-radius: 4px;
            padding: 0 9px
        }

        .proposal {
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 11px;
            margin-top: 9px
        }

        .proposal header {
            display: flex;
            justify-content: space-between
        }

        .proposal p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 12px
        }

        .case-head {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            margin-bottom: 16px
        }

        .case-top {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 17px
        }

        .case-top h1 {
            font-size: 21px;
            margin: 0 0 3px
        }

        .case-top .actions {
            margin-left: auto
        }

        .case-content {
            display: grid;
            grid-template-columns: .9fr 1.3fr 1fr;
            gap: 15px
        }

        .info-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px
        }

        .info-card h3 {
            font-size: 14px;
            margin: 0 0 15px
        }

        .kv {
            display: grid;
            grid-template-columns: 115px 1fr;
            gap: 9px;
            padding: 9px 0;
            border-bottom: 1px solid #edf0f3
        }

        .kv:last-child {
            border: 0
        }

        .kv label {
            color: var(--muted)
        }

        .timeline {
            position: relative
        }

        .event {
            display: grid;
            grid-template-columns: 18px 1fr;
            gap: 9px;
            padding-bottom: 17px
        }

        .event .dot {
            width: 9px;
            height: 9px;
            border: 2px solid #147bd1;
            border-radius: 50%;
            margin: 4px;
            position: relative
        }

        .event .dot:after {
            content: "";
            position: absolute;
            left: 2px;
            top: 9px;
            height: 43px;
            border-left: 1px solid #cbd6e0
        }

        .event:last-child .dot:after {
            display: none
        }

        .event strong {
            display: block;
            font-size: 13px
        }

        .event small {
            display: block;
            color: var(--muted)
        }

        .notice {
            background: var(--amberbg);
            border: 1px solid #efd69b;
            color: #77520b;
            border-radius: 5px;
            padding: 11px 13px;
            margin-bottom: 14px
        }

        .notice.green {
            background: var(--greenbg);
            border-color: #b9e1ca;
            color: var(--green)
        }

        .drawer {
            position: fixed;
            top: 64px;
            right: 0;
            bottom: 0;
            width: 440px;
            background: #fff;
            z-index: 10;
            border-left: 1px solid var(--line);
            box-shadow: -8px 0 25px rgba(19, 39, 62, .14);
            padding: 20px;
            overflow: auto
        }

        .drawer-bg {
            position: fixed;
            inset: 64px 0 0 224px;
            background: rgba(8, 29, 49, .25);
            z-index: 9
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            padding: 12px 16px;
            background: #11304d;
            color: #fff;
            border-radius: 5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .2);
            z-index: 30;
            opacity: 0;
            transform: translateY(8px);
            transition: .2s
        }

        .toast.show {
            opacity: 1;
            transform: none
        }

        .chart {
            display: flex;
            align-items: end;
            gap: 22px;
            height: 190px;
            padding: 25px 20px 10px
        }

        .chart div {
            flex: 1;
            text-align: center;
            color: var(--muted);
            font-size: 12px
        }

        .chart i {
            display: block;
            width: 34px;
            margin: 0 auto 8px;
            background: #2c7fc0;
            border-radius: 3px 3px 0 0
        }

        .hidden {
            display: none !important
        }

        .truck-panel {
            background-position: 27% 74%;
            background-size: 820px auto
        }

        .truck-panel:before {
            background: linear-gradient(180deg, var(--navy) 0%, rgba(6, 28, 49, .7) 32%, rgba(6, 28, 49, .26) 100%)
        }

        .reset-demo {
            border: 1px solid #c7d2de;
            background: #fff;
            border-radius: 4px;
            padding: 7px 10px;
            color: #43546a;
            font-size: 12px;
            font-weight: 700
        }

        .reset-demo:hover {
            background: #f1f5f9;
            color: #172a43
        }

        .login-screen {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 46% 54%;
            background: #fff
        }

        .login-visual {
            position: relative;
            background: linear-gradient(rgba(6, 28, 49, .78), rgba(6, 28, 49, .88)), url('assets/aa-truck.webp') center/cover;
            color: #fff;
            padding: 54px;
            display: flex;
            flex-direction: column
        }

        .login-logo {
            width: 245px;
            background: #fff;
            border-radius: 5px;
            padding: 9px 13px
        }

        .login-logo img {
            width: 100%;
            display: block
        }

        .login-message {
            margin-top: auto;
            max-width: 500px;
            margin-bottom: 55px
        }

        .login-message h1 {
            font-size: 38px;
            line-height: 1.14;
            margin: 0 0 15px
        }

        .login-message p {
            font-size: 18px;
            color: #d2deea
        }

        .login-entry {
            display: grid;
            place-items: center
        }

        .login-box {
            width: 420px
        }

        .login-box h2 {
            font-size: 28px;
            margin: 0 0 7px
        }

        .login-box>p {
            color: var(--muted);
            margin: 0 0 25px
        }

        .microsoft-login {
            width: 100%;
            height: 50px;
            border: 1px solid #bfcad6;
            border-radius: 5px;
            background: #fff;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px
        }

        .ms-grid {
            display: grid;
            grid-template-columns: 8px 8px;
            gap: 2px
        }

        .ms-grid i {
            width: 8px;
            height: 8px;
            display: block
        }

        .ms-grid i:nth-child(1) {
            background: #f35325
        }

        .ms-grid i:nth-child(2) {
            background: #81bc06
        }

        .ms-grid i:nth-child(3) {
            background: #05a6f0
        }

        .ms-grid i:nth-child(4) {
            background: #ffba08
        }

        .login-note {
            margin-top: 17px;
            background: #f5f8fb;
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 12px;
            color: var(--muted);
            font-size: 12px
        }

        .profile-trigger {
            border: 0;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            border-radius: 5px;
            padding: 4px 7px
        }

        .profile-trigger:hover {
            background: #f1f5f9
        }

        .menu-wrap {
            position: relative
        }

        .drop-menu {
            position: absolute;
            right: 0;
            top: 44px;
            width: 300px;
            max-height: 465px;
            overflow: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(17, 39, 65, .18);
            z-index: 50;
            padding: 7px
        }

        .drop-menu button {
            width: 100%;
            border: 0;
            background: #fff;
            text-align: left;
            padding: 10px;
            border-radius: 4px
        }

        .drop-menu button:hover,
        .drop-menu button.selected {
            background: #edf5fd
        }

        .drop-menu strong,
        .drop-menu small {
            display: block
        }

        .drop-menu small {
            color: var(--muted)
        }

        .menu-label {
            padding: 7px 10px 3px;
            color: #718095;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .bell-wrap {
            position: relative
        }

        .bell-badge {
            position: absolute;
            right: -3px;
            top: -3px;
            background: var(--red);
            color: #fff;
            border-radius: 9px;
            min-width: 16px;
            height: 16px;
            font-size: 10px;
            display: grid;
            place-items: center
        }

        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(5, 24, 42, .46);
            z-index: 60;
            display: grid;
            place-items: center
        }

        .assign-modal {
            width: 560px;
            max-height: 88vh;
            background: #fff;
            border-radius: 7px;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .25);
            overflow: auto
        }

        .assign-modal h2 {
            font-size: 18px;
            margin: 0;
            padding: 17px;
            border-bottom: 1px solid var(--line)
        }

        .assign-modal .body {
            padding: 18px
        }

        .assign-modal .footer {
            padding: 14px 18px;

        function kanbanInspector(t) { if (!t) return `<aside class="task-inspector"><div class="case-empty">Select a Task to view its details.</div></aside>`; let status = kanbanStatus(t), c = selectedCaseData(), assigned = taskAssignmentDate(t), files = [...(S.attachments[t[8]] || []).map(x=>x.name),...(c.attachments || [])].slice(0,2), comments = (S.comments[t[8]] || []).slice(-2), canUpdate = canUpdateTask(t), canAssign = canAssignFromDetail(t); if (!comments.length) comments = [{author:'Sofia Lind',text:'Shipment information checked against the customer attachment.',at:'10 Oct 2026, 09:15'}]; return `<aside class="task-inspector"><div class="task-inspector-scroll"><div class="task-inspector-head"><div style="display:flex;align-items:center;gap:8px"><span class="id">${t[8]}</span>${pill(status)}<button class="link" style="margin-left:auto" onclick="openTask('${t[8]}')">Open full Task</button></div><h2>${t[0]}</h2></div><section class="task-inspector-section"><h3>What needs to be done</h3><p class="sub" style="line-height:1.5">${taskInstruction(t)}</p></section><section class="task-inspector-section"><div style="display:flex;justify-content:space-between"><h3>Task Details</h3>${S.role==='Admin'?`<button class="link" onclick="openEditor('task','${t[8]}')">✎ Edit</button>`:''}</div><div class="task-inspector-kv"><span>Department</span><strong>${t[3]}</strong><span>Owner</span><strong>${t[4]} ${canAssign?`<button class="link" onclick="openTaskAssignment('${t[8]}')">${t[4]==='Unassigned'?'Assign':'Reassign'} Task</button>`:''}</strong><span>Priority</span><strong>${pill(t[5])}</strong><span>Assigned</span><strong>${assigned}</strong><span>Due</span><strong class="${taskDeadlineState(t)?'deadline-warning':''}">${t[6]} ${taskDeadlineState(t)?`· ${taskDeadlineState(t)}`:''}</strong><span>Classification</span><strong>${t[9]}</strong></div></section><section class="task-inspector-section"><h3>Dependencies</h3><div class="notice ${status!=='Blocked'?'green':''}" style="padd         function kanbanCommand(rows) { let all = selectedCaseTasks(), departments = [...new Set(all.map(t=>t[3]))], priorities = ['High','Medium','Low'], owners = [...new Set(all.map(t=>t[4]))]; return `<div class="task-command"><div class="task-command-title"><h2>Case Tasks</h2><span class="sub">Work required to complete this Case</span></div><div class="task-view-toggle"><button class="${(S.caseTaskView||'Board')==='Board'?'active':''}" onclick="setCaseTaskView('Board')">Board</button><button class="${S.caseTaskView==='List'?'active':''}" onclick="setCaseTaskView('List')">List</button></div><input class="task-command-search" value="${editorText(S.kanbanQuery||'')}" onchange="setKanbanFilter('kanbanQuery',this.value)" onkeyup="if(event.key==='Enter')setKanbanFilter('kanbanQuery',this.value)" placeholder="Search Tasks…"><select onchange="setKanbanFilter('kanbanDepartment',this.value)"><option>All Departments</option>${departments.map(x=>`<option ${S.kanbanDepartment===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="setKanbanFilter('kanbanPriority',this.value)"><option>All Priorities</option>${priorities.map(x=>`<option ${S.kanbanPriority===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="S.kanbanMore=!S.kanbanMore;render()">More Filters⌄</button>${S.role==='Admin'?`<button class="btn primary" onclick="openEditor('newTask','${selectedCaseData().id}')">+ Add Task</button>`:''}</div>${S.kanbanMore?`<div class="case-strip" style="justify-content:flex-end"><label class="sub">Owner <select style="height:34px;margin-left:5px" onchange="setKanbanFilter('kanbanOwner',this.value)"><option>All Owners</option>${owners.map(x=>`<option ${S.kanbanOwner===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="sub">Deadline <select style="height:34px;margin-left:5px" onchange="setKanbanFilter('kanbanDeadline',this.value)"><option>All Deadlines</option><option ${S.kanbanDeadline==='Due Today'?'selected':''}>Due Today</option><option ${S.kanbanDeadline==='Overdue'?'selected':''}>Overdue</option></select></label><button class="btn" onclick="S.kanbanOwner='All Owners';S.kanbanDeadline='All Deadlines';render()">Clear</button></div>`:''}` }
        caseTasksV2 = function () { let rows = kanbanFilteredTasks(); S.caseTaskView = S.caseTaskView || 'Board'; let selected = taskById(S.kanbanTaskId); if (!selected || selected[1] !== selectedCaseData().id || !rows.includes(selected)) { selected = rows[0] || null; S.kanbanTaskId = selected?.[8] || null } return `${kanbanCommand(rows)}${S.caseTaskView==='List'?kanbanTaskList(rows):`<div class="kanban-shell">${kanbanBoard(rows)}${kanbanInspector(selected)}</div>`}` }
        updateTaskStatus = function (id) { let t = taskById(id), select = document.getElementById('task-status-select'), box = document.getElementById('task-status-comment'), next = select?.value, comment = box?.value?.trim(); if (!t || !canUpdateTask(t)) { toast('Only the assigned Task owner or Admin can change status'); return } if (!TASK_WORKFLOW_STATUSES.includes(next)) { toast('Select Pending, In Progress, Blocked, or Completed'); return } let previous = kanbanStatus(t); if (next === previous) { toast('Select a different status'); return } if (!comment) { toast('A comment is required when changing status'); return } let at = '10 Oct 2026, 10:30', author = actorName(); t[7] = next; (S.comments[id] = S.comments[id] || []).push({author,text:`Status changed from ${previous} to ${next}: ${comment}`,at,statusChange:true}); (TASK_STATUS_HISTORY[id] = TASK_STATUS_HISTORY[id] || []).unshift({from:previous,to:next,comment,author,at}); S.activities.unshift([`${id} status changed from ${previous} to ${next}`,author,at]); if (next === 'Completed') TASK_COMPLETIONS[id] = {at,by:author}; else delete TASK_COMPLETIONS[id]; render(); toast(`${id} moved to ${next}`) }
        function beginTaskDrag(event, id) { let t = taskById(id); if (!t || !canUpdateTask(t)) { event.preventDefault(); toast('Only the assigned Task owner or Admin can move this Task'); return } S.dragTaskId = id; event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', id); event.currentTarget.classList.add('dragging') }
        function endTaskDrag(event) { event.currentTarget.classList.remove('dragging'); document.querySelectorAll('.kanban-column').forEach(x => x.classList.remove('drop-target','drop-denied')); S.dragTaskId = null }
        function allowTaskDrop(event, status) { let t = taskById(S.dragTaskId || event.dataTransfer.getData('text/plain')); if (!t || !canUpdateTask(t)) return; event.preventDefault(); event.dataTransfer.dropEffect = 'move'; event.currentTarget.classList.toggle('drop-target', kanbanStatus(t) !== status); event.currentTarget.classList.toggle('drop-denied', kanbanStatus(t) === status) }
        function leaveTaskDrop(event) { if (!event.currentTarget.contains(event.relatedTarget)) event.currentTarget.classList.remove('drop-target','drop-denied') }
        function dropTaskInColumn(event, status) { event.preventDefault(); event.currentTarget.classList.remove('drop-target','drop-denied'); let id = event.dataTransfer.getData('text/plain') || S.dragTaskId, t = taskById(id); S.dragTaskId = null; if (!t || !canUpdateTask(t)) { toast('You do not have permission to move this Task'); return } let from = kanbanStatus(t); if (from === status) { toast(`${id} is already ${status}`); return } if (!TASK_WORKFLOW_STATUSES.includes(status)) { toast('Invalid Task status'); return } S.kanbanMove = {id,from,to:status}; S.editorType = 'kanbanMove'; S.editorDirty = false; render() }
        function cancelKanbanMove() { S.kanbanMove = null; S.editorType = null; render() }
        function applyKanbanStatus(id, next, comment) { let t = taskById(id); if (!t || !canUpdateTask(t)) { toast('Only the assigned Task owner or Admin can change status'); return false } if (!TASK_WORKFLOW_STATUSES.includes(next)) { toast('Select Pending, In Progress, Blocked, or Completed'); return false } let previous = kanbanStatus(t); if (next === previous) { toast('Select a different status'); return false } if (!String(comment || '').trim()) { toast('A comment is required when changing status'); return false } let at = '10 Oct 2026, 10:30', author = actorName(), note = String(comment).trim(); t[7] = next; (S.comments[id] = S.comments[id] || []).push({author,text:`Status changed from ${previous} to ${next}: ${note}`,at,statusChange:true}); (TASK_STATUS_HISTORY[id] = TASK_STATUS_HISTORY[id] || []).unshift({from:previous,to:next,comment:note,author,at}); S.activities.unshift([`${id} status changed from ${previous} to ${next}`,author,at]); if (next === 'Completed') TASK_COMPLETIONS[id] = {at,by:author}; else delete TASK_COMPLETIONS[id]; return true }
        function confirmKanbanMove() { let move = S.kanbanMove, comment = document.getElementById('kanban-move-comment')?.value?.trim(); if (!move) return; if (!comment) { toast('A comment is required when changing status'); return } if (!applyKanbanStatus(move.id,move.to,comment)) return; S.kanbanTaskId = move.id; S.kanbanMove = null; S.editorType = null; render(); toast(`${move.id} moved to ${move.to}`) }
        updateTaskStatus = function (id) { let next = document.getElementById('task-status-select')?.value, comment = document.getElementById('task-status-comment')?.value?.trim(); if (!applyKanbanStatus(id,next,comment)) return; render(); toast(`${id} moved to ${next}`) }
        kanbanCard = function (t) { let status = kanbanStatus(t), deadline = taskDeadlineState(t), comments = (S.comments[t[8]] || []).length, files = (S.attachments[t[8]] || []).length, owner = t[4] || 'Unassigned', selected = S.kanbanTaskId === t[8], draggable = canUpdateTask(t); return `<article class="kanban-card ${selected?'selected':''}" draggable="${draggable}" aria-label="${t[8]} ${t[0]}. ${status}.${draggable?' Drag to change status.':''}" onclick="selectKanbanTask('${t[8]}')" ondragstart="beginTaskDrag(event,'${t[8]}')" ondragend="endTaskDrag(event)"><button class="case-link" onclick="event.stopPropagation();selectKanbanTask('${t[8]}')">${t[8]}</button><h3>${t[0]}</h3><div class="kanban-card-line"><span>▧</span><span>${t[3]}</span><span style="margin-left:auto">${pill(t[5])}</span></div><div class="kanban-card-line"><span class="avatar">${owner==='Unassigned'?'—':casePersonInitials(owner)}</span><strong>${owner}</strong></div><div class="kanban-card-line ${deadline?'deadline-warning':''}"><span>▣</span><span>${deadline ? `${deadline}, ` : 'Due '}${t[6]}</span></div><div class="sub">${owner==='Unassigned'?'Assignment needed':`Assigned ${taskAssignmentDate(t)}`}</div>${status==='Blocked'?`<div class="notice" style="margin:9px 0 0;padding:7px;font-size:11px">Waiting for required operational confirmation</div>`:''}<div class="kanban-card-foot"><span>◯ ${comments}</span><span>⌕ ${files}</span><span>↗ ${status==='Pending'?'1':'0'}</span>${draggable?'<span class="drag-help">Drag to move</span>':''}</div></article>` }
        kanbanBoard = function (rows) { return `<div class="kanban-board">${TASK_WORKFLOW_STATUSES.map(status => { let cards = rows.filter(t => kanbanStatus(t) === status); return `<section class="kanban-column" data-status="${status}" aria-label="${status} Tasks drop zone" ondragover="allowTaskDrop(event,'${status}')" ondragleave="leaveTaskDrop(event)" ondrop="dropTaskInColumn(event,'${status}')"><div class="kanban-column-head"><i class="kanban-dot"></i><span>${status} (${cards.length})</span></div><div class="kanban-cards">${cards.length?cards.map(kanbanCard).join(''):`<div class="kanban-empty">No ${status.toLowerCase()} Tasks<br><span class="sub">Drop a Task here</span></div>`}</div></section>` }).join('')}</div>` }
        const kanbanEditorBase = editorDialog; editorDialog = function () { if (S.editorType === 'kanbanMove' && S.kanbanMove) { let move = S.kanbanMove, t = taskById(move.id); return `<div class="modal-shade"><div class="assign-modal" style="width:520px"><h2>Update Task Status</h2><div class="body"><p><strong>${t[8]} · ${t[0]}</strong></p><div class="kanban-move-summary"><div><span>Current status</span><strong>${move.from}</strong></div><strong class="kanban-move-arrow">→</strong><div><span>New status</span><strong>${move.to}</strong></div></div><label><strong>Comment</strong><textarea id="kanban-move-comment" style="width:100%;height:92px;margin-top:6px;border:1px solid var(--line);border-radius:5px;padding:10px" placeholder="Required: explain this status change"></textarea></label><p class="sub">The Task will move to the ${move.to} column after this change is confirmed.</p></div><div class="footer"><button class="btn" onclick="cancelKanbanMove()">Cancel</button><button class="btn primary" onclick="confirmKanbanMove()">Move to ${move.to}</button></div></div></div>` } return kanbanEditorBase() }
        function openTaskContext(taskId) { let t = taskById(taskId); if (!t) return; S.selectedCase = t[1]; S.selectedTask = taskId; S.kanbanTaskId = taskId; S.page = 'case'; S.caseTab = 'Tasks'; S.caseTaskView = 'Board'; S.drawer = false; render() }
        function rowOnclickArgument(button, functionName) { if (!button) return ''; let source = button.getAttribute('onclick') || '', match = source.match(new RegExp(functionName + "\\('([^']+)'")); return match ? match[1] : '' }
        function resolveRowNavigation(row) { if (!row || row.closest('.compact-order-table') || S.page === 'users' || S.page === 'dashboard') return null; let reviewButton = row.querySelector('button[onclick*="openReviewCase("]'), reviewId = rowOnclickArgument(reviewButton, 'openReviewCase'); if (reviewId) return {label:`Review ${reviewId}`,run:()=>openReviewCase(reviewId)}; let acknowledgementButton = row.querySelector('button[onclick*="openAcknowledgementCase("]'), acknowledgementId = rowOnclickArgument(acknowledgementButton, 'openAcknowledgementCase'); if (acknowledgementId) return {label:`Open communication for ${acknowledgementId}`,run:()=>openAcknowledgementCase(acknowledgementId)}; let text = row.textContent || '', taskMatch = text.match(/TASK-\d+/), task = taskMatch && taskById(taskMatch[0]); if (task) return {label:`Open ${task[8]}`,run:()=>openTaskContext(task[8])}; let caseMatch = text.match(/CASE-\d+/), caseId = caseMatch && CASE_DETAILS[caseMatch[0]] ? caseMatch[0] : ''; if (caseId) return {label:`Open ${caseId}`,run:()=>{S.selectedCase=caseId;S.page='case';S.caseTab='Overview';S.drawer=false;render()}}; return null }
        function rowClickIsInteractive(target, row) { return !!target.closest('button,a,input,select,textarea,label,[role="button"],[contenteditable="true"]') || target !== row && !!target.closest('[data-row-interactive]') }
        function activateRecordRow(event, row, navigation) { if (rowClickIsInteractive(event.target,row)) return; if (event.type === 'click' && String(globalThis.getSelection?.() || '').trim()) return; if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return; if (event.type === 'keydown') event.preventDefault(); navigation.run() }
        function navigationOnlyControl(control) { let text = String(control?.textContent || '').trim().toLowerCase(), source = control?.getAttribute('onclick') || '', labels = ['open','review','open communication','view details']; return labels.includes(text) && /(openTask|openCase|openReviewCase|openAcknowledgementCase|openCommunication|openTaskContext)/.test(source) }
        function removeRedundantActionColumns() { document.querySelectorAll('table').forEach(table => { let header = table.querySelector('thead tr'), rows = [...table.querySelectorAll('tbody tr')]; if (!header || !rows.length) return; let lastHeader = header.lastElementChild, headerText = String(lastHeader?.textContent || '').trim().toLowerCase(); if (headerText !== 'action' && headerText !== '') return; let removedAny = false; rows.forEach(row => { let cell = row.lastElementChild; if (!cell) return; [...cell.querySelectorAll('button,a')].filter(navigationOnlyControl).forEach(control => { control.remove(); removedAny = true }) }); if (!removedAny) return; let hasWorkflowActions = rows.some(row => row.lastElementChild?.querySelector('button,a,input,select')); if (!hasWorkflowActions) { lastHeader.remove(); rows.forEach(row => row.lastElementChild?.remove()); return } rows.forEach(row => { let cell = row.lastElementChild; if (cell && !cell.querySelector('button,a,input,select') && !String(cell.textContent || '').trim()) cell.innerHTML = '<span class="sub">—</span>' }) }) }
        function enableClickableRows() { document.querySelectorAll('table tbody tr').forEach(row => { let navigation = resolveRowNavigation(row); if (!navigation) return; row.classList.add('clickable-record'); row.tabIndex = 0; row.setAttribute('role','link'); row.setAttribute('aria-label',navigation.label); row.title = navigation.label; row.addEventListener('click',event=>activateRecordRow(event,row,navigation)); row.addEventListener('keydown',event=>activateRecordRow(event,row,navigation)); let first = row.querySelector('td'); if (first && !first.querySelector('.row-navigation-hint')) first.insertAdjacentHTML('beforeend','<span class="row-navigation-hint" aria-hidden="true">Open ›</span>') }); removeRedundantActionColumns() }
        const rowNavigationRender = render; render = function () { rowNavigationRender(); enableClickableRows() };
        render();
    </script>
